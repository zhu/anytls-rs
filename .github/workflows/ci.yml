name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Match Release: locked cmake cannot detect windows-latest's VS 2026 yet.
        os: [ubuntu-latest, macos-latest, windows-2022]
        rust: [stable, beta]
        exclude:
          - os: windows-2022
            rust: beta
    steps:
      - uses: actions/checkout@v7
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-
      
      - name: Check formatting
        run: cargo fmt --check
        continue-on-error: false
      
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
        continue-on-error: false
      
      - name: Build
        run: cargo build --locked --verbose --all-features
      
      - name: Run tests
        run: cargo test --locked --verbose --all-features
      
      - name: Build binaries
        run: cargo build --locked --release --verbose --bin anytls-client --bin anytls-server
      
      - name: Upload artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.os }}
          path: target/release/anytls-*

  # Note: Full benchmark workflow is handled by benchmark.yml
  # This job is kept for quick validation only
  benchmark-quick:
    name: Benchmark (Quick Check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-cargo-bench-quick-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-cargo-bench-quick-
      
      - name: Build benchmark fixtures
        run: cargo bench --locked --no-run --bench session_bench --bench stream_bench --bench e2e_bench

      - name: Quick benchmark validation
        timeout-minutes: 4
        run: |
          for bench in session_bench stream_bench e2e_bench; do
            timeout 60s cargo bench --locked --bench "$bench" -- --test
          done

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install cargo-audit
        run: |
          if ! cargo install --list | grep -q cargo-audit; then
            cargo install cargo-audit --locked
          fi
      
      - name: Run cargo audit
        run: cargo audit


  interoperability:
    name: dae and reference client interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache-dependency-path: tests/interop/*/go.sum
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --bin anytls-server
      - name: Run actual client transports
        run: |
          SERVER_BINARY="$GITHUB_WORKSPACE/target/debug/anytls-server"
          for client in dae reference; do
            (cd "tests/interop/$client" && go run -mod=readonly -buildvcs=false . -server-binary "$SERVER_BINARY")
          done
