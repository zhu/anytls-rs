name: Release

on:
  push:
    tags: ['v*', 'custom-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g., custom-v0.5.4.2)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      archive_version: ${{ steps.version.outputs.archive_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import os, re, subprocess, tomllib
          tag = os.environ['RELEASE_TAG']
          custom = re.fullmatch(r'custom-v(\d+\.\d+\.\d+)\.(\d+)', tag)
          standard = re.fullmatch(r'v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)', tag)
          if custom:
              expected = custom[1] + '-custom.' + custom[2]
          elif standard:
              expected = standard[1]
          else:
              raise SystemExit('Invalid release tag')
          with open('Cargo.toml', 'rb') as source:
              actual = tomllib.load(source)['package']['version']
          if actual != expected:
              raise SystemExit(f'Tag expects Cargo version {expected}, found {actual}')
          existing = subprocess.run(['git', 'rev-parse', '--verify', f'refs/tags/{tag}^{{commit}}'], text=True, capture_output=True)
          if existing.returncode == 0 and existing.stdout.strip() != os.environ['GITHUB_SHA']:
              raise SystemExit('Existing tag points to another commit; refusing to replace its assets')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\narchive_version={tag.removeprefix("v")}\n')
          PYTHON

  verify:
    name: Verify release and real Go clients
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache-dependency-path: tests/interop/*/go.sum
      - uses: Swatinem/rust-cache@v2
      - name: Audit locked dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo build --locked --bin anytls-server
      - name: Test dae transport and anytls-go reference
        run: |
          SERVER_BINARY="$GITHUB_WORKSPACE/target/debug/anytls-server"
          for client in dae reference; do
            (cd "tests/interop/$client" && go run -mod=readonly -buildvcs=false . -server-binary "$SERVER_BINARY")
          done

  build:
    name: Build Release - ${{ matrix.os }} (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (GNU)
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            artifact_name: anytls-linux-x86_64
            binary_ext: ""
            archive_ext: tar.gz
            archive_cmd: tar czf
          
          # Linux ARM64
          - os: ubuntu-latest
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            artifact_name: anytls-linux-aarch64
            binary_ext: ""
            archive_ext: tar.gz
            archive_cmd: tar czf
          
          # Linux x86_64 (musl)
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-musl
            artifact_name: anytls-linux-x86_64-musl
            binary_ext: ""
            archive_ext: tar.gz
            archive_cmd: tar czf
          
          # macOS x86_64 (Intel)
          - os: macos-latest
            arch: x86_64
            target: x86_64-apple-darwin
            artifact_name: anytls-macos-x86_64
            binary_ext: ""
            archive_ext: tar.gz
            archive_cmd: tar czf
          
          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            arch: arm64
            target: aarch64-apple-darwin
            artifact_name: anytls-macos-arm64
            binary_ext: ""
            archive_ext: tar.gz
            archive_cmd: tar czf
          
          # Windows x86_64
          - os: windows-2022
            arch: x86_64
            target: x86_64-pc-windows-msvc
            artifact_name: anytls-windows-x86_64
            binary_ext: .exe
            archive_ext: zip
            archive_cmd: powershell Compress-Archive
          
          # Windows ARM64
          - os: windows-2022
            arch: arm64
            target: aarch64-pc-windows-msvc
            artifact_name: anytls-windows-arm64
            binary_ext: .exe
            archive_ext: zip
            archive_cmd: powershell Compress-Archive
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install cross-compilation dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          elif [ "${{ matrix.target }}" == "x86_64-unknown-linux-musl" ]; then
            sudo apt-get install -y musl-tools
          fi
      
      - name: Configure cross-compilation linker (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p .cargo
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            cat >> .cargo/config.toml <<EOF
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
          elif [ "${{ matrix.target }}" == "x86_64-unknown-linux-musl" ]; then
            cat >> .cargo/config.toml <<EOF
          [target.x86_64-unknown-linux-musl]
          linker = "x86_64-linux-musl-gcc"
          EOF
          fi
      
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-release-
      
      - name: Build release binaries
        run: |
          cargo build --locked --release --verbose --target ${{ matrix.target }} --bin anytls-client --bin anytls-server
      
      - name: Create release archive
        shell: bash
        env:
          ARCHIVE_VERSION: ${{ needs.prepare.outputs.archive_version }}
        run: |
          VERSION="$ARCHIVE_VERSION"
          ARTIFACT_NAME="${{ matrix.artifact_name }}-${VERSION}"
          ARTIFACT_DIR="release"
          mkdir -p "${ARTIFACT_DIR}"
          cp LICENSE README.md README.en.md "${ARTIFACT_DIR}/"
          mkdir -p "${ARTIFACT_DIR}/docs"
          cp docs/SERVER_COMPATIBILITY.md docs/DEPENDENCY_AUDIT.md docs/DEPENDENCY_AUDIT.json "${ARTIFACT_DIR}/docs/"
          if [ -f docs/CHANGELOG.md ]; then
            cp docs/CHANGELOG.md "${ARTIFACT_DIR}/docs/"
          fi
          if ls docs/RELEASE_NOTES_*.md >/dev/null 2>&1; then
            cp docs/RELEASE_NOTES_*.md "${ARTIFACT_DIR}/docs/"
          fi
          
          if [ "${{ matrix.archive_ext }}" == "zip" ]; then
            # Windows
            cp "target/${{ matrix.target }}/release/anytls-client${{ matrix.binary_ext }}" "${ARTIFACT_DIR}/anytls-client${{ matrix.binary_ext }}"
            cp "target/${{ matrix.target }}/release/anytls-server${{ matrix.binary_ext }}" "${ARTIFACT_DIR}/anytls-server${{ matrix.binary_ext }}"
            cd "${ARTIFACT_DIR}"
            powershell -Command "Compress-Archive -Path * -DestinationPath '../${ARTIFACT_NAME}.zip' -Force"
            cd ..
            ARTIFACT_PATH="${ARTIFACT_NAME}.zip"
          else
            # Linux/macOS
            cp "target/${{ matrix.target }}/release/anytls-client${{ matrix.binary_ext }}" "${ARTIFACT_DIR}/anytls-client"
            cp "target/${{ matrix.target }}/release/anytls-server${{ matrix.binary_ext }}" "${ARTIFACT_DIR}/anytls-server"
            ARTIFACT_PATH="${ARTIFACT_NAME}.tar.gz"
            tar czf "${ARTIFACT_PATH}" -C "${ARTIFACT_DIR}" .
          fi
          echo "ARTIFACT_PATH=${ARTIFACT_PATH}" >> $GITHUB_ENV
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}-${{ needs.prepare.outputs.tag }}
          path: |
            ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error
          retention-days: 90

  checksum:
    name: Generate release checksums
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: anytls-*-${{ needs.prepare.outputs.tag }}
          merge-multiple: true
      - name: Generate checksums
        working-directory: artifacts
        run: |
          for archive in *.tar.gz *.zip; do
            [ -f "$archive" ] || continue
            sha256sum "$archive" > "$archive.sha256"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: checksums-${{ needs.prepare.outputs.tag }}
          path: artifacts/*.sha256
          if-no-files-found: error
          retention-days: 90

  create-release:
    name: Create GitHub release
    needs: [prepare, verify, build, checksum]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: anytls-*-${{ needs.prepare.outputs.tag }}
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          path: checksums
          name: checksums-${{ needs.prepare.outputs.tag }}
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          NOTES="docs/RELEASE_NOTES_${RELEASE_TAG}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" RELEASE_NOTES.md
          else
            printf '# Release %s\n\nSee the changelog and attached binaries.\n' "$RELEASE_TAG" > RELEASE_NOTES.md
          fi
          cat >> RELEASE_NOTES.md <<'NOTES'

          ## Downloads

          Archives include `anytls-server`, `anytls-client`, documentation, and LICENSE.
          Use the archive matching your operating system and CPU. Each archive has a
          SHA256 file; verify on Linux/macOS with `shasum -a 256 -c <archive>.sha256`.
          Custom releases are distributed here, not through crates.io.
          NOTES
      - name: Publish tag and release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.tag }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            checksums/*.sha256
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: true
